sonar.projectKey=mablab
sonar.projectName=Mablab
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.ts,__tests__/**/*.test.tsx

sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,.next/**,public/**,coverage/**,**/*.config.*

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/data/**,src/app/layout.tsx,src/app/globals.css
